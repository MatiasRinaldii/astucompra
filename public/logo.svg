<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A6EEB"/>
      <stop offset="100%" stop-color="#00C4FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="120" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <ellipse cx="60" cy="35" rx="45" ry="30" fill="url(#shine)"/>
  <!-- Inner circle border -->
  <circle cx="60" cy="60" r="52" stroke="white" stroke-opacity="0.15" stroke-width="1.5" fill="none"/>
  <!-- AS letters -->
  <text x="60" y="72" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="38" fill="white" text-anchor="middle" letter-spacing="-2">as</text>
  <!-- Small dot accent -->
  <circle cx="93" cy="30" r="5" fill="white" opacity="0.4"/>
</svg>
